<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="scene-lsm-2-title scene-lsm-2-desc"><title id="scene-lsm-2-title">同一個鍵可能有多個版本</title><desc id="scene-lsm-2-desc">比喻：先把新單據收好，累積後分類歸檔，再整理重複的舊版本。</desc><defs><marker id="scene-lsm-2-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#137d83"/></marker></defs><rect width="900" height="100%" rx="20" fill="#f6f8fd"/><path d="M20 295 Q240 270 450 292 T880 294 V390 H20Z" fill="#e6edf4"/><text x="30" y="36" text-anchor="start" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="700" fill="#25394d">同一個鍵可能有多個版本</text><text x="30" y="67" text-anchor="start" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" fill="#596c80">比喻：先把新單據收好，累積後分類歸檔，再整理重複的舊版本。</text><circle cx="120" cy="155" r="23" fill="#f5cda7"/><path d="M96 149 Q120 107 144 149" fill="#344256"/><path d="M83 197 Q120 169 157 197 L162 250 H78Z" fill="#137d83"/><rect x="81" y="207" width="78" height="42" rx="4" fill="#fff" stroke="#a7b7c8" stroke-width="2"/><path d="M71 253 H169" stroke="#5e7284" stroke-width="5"/><text x="120" y="286" text-anchor="middle" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#25394d">寫入端</text><text x="120" y="312" text-anchor="middle" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" fill="#137d83">新資料 A:v2</text><path d="M407 137 L426 126 H519 L502 137Z" fill="#c5d3e2"/><path d="M502 137 L519 126 V243 L502 255Z" fill="#6d839f"/><rect x="407" y="137" width="95" height="118" rx="4" fill="#fff" stroke="#8195af" stroke-width="2"/><rect x="419" y="149" width="71" height="25" rx="3" fill="#e7edf7" stroke="none" stroke-width="2"/><circle cx="475" cy="161" r="4" fill="#137d83"/><rect x="419" y="183" width="71" height="25" rx="3" fill="#e7edf