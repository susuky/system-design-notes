<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="scene-retry-3-title scene-retry-3-desc"><title id="scene-retry-3-title">差別藏在副作用邊界</title><desc id="scene-retry-3-desc">同樣的逾時與重試，在不同設計下得到不同業務結果。</desc><defs><marker id="scene-retry-3-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#137d83"/></marker></defs><rect width="900" height="100%" rx="20" fill="#f6f8fd"/><path d="M20 295 Q240 270 450 292 T880 294 V390 H20Z" fill="#e6edf4"/><text x="30" y="36" text-anchor="start" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="700" fill="#25394d">差別藏在副作用邊界</text><text x="30" y="67" text-anchor="start" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" fill="#596c80">同樣的逾時與重試，在不同設計下得到不同業務結果。</text><ellipse class="scene-halo" cx="235" cy="192" rx="77" ry="89" fill="#d8eeec"/><circle cx="235" cy="144" r="23" fill="#f5cda7"/><path d="M211 138 Q235 96 259 138" fill="#344256"/><path d="M198 186 Q235 158 272 186 L277 239 H193Z" fill="#cd4962"/><rect x="196" y="196" width="78" height="42" rx="4" fill="#fff" stroke="#a7b7c8" stroke-width="2"/><path d="M186 242 H284" stroke="#5e7284" stroke-width="5"/><text x="235" y="275" text-anchor="middle" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#25394d">沒有冪等保護</text><text x="235" y="301" text-anchor="middle" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" fill="#cd4962">實際扣款 2 次</text><rect x="191.0" y="84" width="88" height="34" rx="17" fill="#fff" stroke="#cd4962" stroke-width="2"/><text x="235" y="107" text-anchor="middle" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="700" fill="#cd4962">請求 K</text><circle cx="185" cy="329" r="23" fill="#ffe3a6" stroke="#b88126" stroke-width="2"/><text x="185" y="337" text-anchor="middle" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="24" font-weight="700" fill="#bd7412">$</text><circle cx="280" cy="329" r="23" fill="#ffe3a6" stroke="#b88126" stroke-width="2"/><text x="280" y="337" text-anchor="middle" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="24" font-weight="700" fill="#bd7412">$</text><ellipse class="scene-halo" cx="665" cy="192" rx="77" ry="89" fill="#d8eeec"/><circle cx="665" cy="144" r="23" fill="#f5cda7"/><path d="M641 138 Q665 96 689 138" fill="#344256"/><path d="M628 186 Q665 158 702 186 L707 239 H623Z" fill="#137d83"/><rect x="626" y="196" width="78" height="42" rx="4" fill="#fff" stroke="#a7b7c8" stroke-width="2"/><path d="M616 242 H714" stroke="#5e7284" stroke-width="5"/><text x="665" y="275" text-anchor="middle" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#25394d">同鍵 K 回傳既有結果</text><text x="665" y="301" text-anchor="middle" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" fill="#137d83">實際扣款 1 次</text><rect x="621.0" y="84" width="88" height="34" rx="17" fill="#fff" stroke="#137d83" stroke-width="2"/><text x="665" y="107" text-anchor="middle" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="700" fill="#137d83">請求 K</text><circle cx="615" cy="329" r="23" fill="#ffe3a6" stroke="#b88126" stroke-width="2"/><text x="615" y="337" text-anchor="middle" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="24" font-weight="700" fill="#bd7412">$</text><text x="450" y="391" text-anchor="middle" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#25394d">示意用扣款次數，不代表真實支付流程只有這幾個步驟。</text></svg>