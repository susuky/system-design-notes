<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="visual-09-budget-title visual-09-budget-desc"><title id="visual-09-budget-title">逾時預算：下游只能花掉「剩餘」時間</title><desc id="visual-09-budget-desc">教學假設：端到端 1,000 ms 預算，時間軸按比例畫出。</desc><defs><marker id="visual-09-budget-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">逾時預算：下游只能花掉「剩餘」時間</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">教學假設：端到端 1,000 ms 預算，時間軸按比例畫出。</text><rect x="40" y="155" width="176.0" height="85" rx="0" fill="#d5e9f9" stroke="none" stroke-width="1.5"/><text x="128.0" y="184" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#163b42">入口／排隊</text><text x="128.0" y="219" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#163b42">200 ms</text><rect x="216.0" y="155" width="88.0" height="85" rx="0" fill="#c2e7df" stroke="none" stroke-width="1.5"/><text x="260.0" y="184" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#163b42">本地運算</text><text x="260.0" y="219" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#163b42">100 ms</text><rect x="304.0" y="155" width="440.0" height="85" rx="0" fill="#f9ddae" stroke="none" stroke-width="1.5"/><text x="524.0" y="184" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#163b42">下游請求</text><text x="524.0" y="219" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#163b42">500 ms</text><rect x="744.0" y="155" width="176.0" height="85" rx="0" fill="#e5dff3" stroke="none" stroke-width="1.5"/><text x="832.0" y="184" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#163b42">回傳／緩衝</text><text x="832.0" y="219" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#163b42">200 ms</text><text x="40" y="271" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#163b42">0</text><text x="304" y="271" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#163b42">300</text><text x="744" y="271" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#163b42">800</text><text x="910" y="271" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#163b42">1,000 ms</text><rect x="24" y="318" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="347" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">已花 300 ms 時只剩 700 ms；重試也必須放進同一個截止時間。</text></svg>