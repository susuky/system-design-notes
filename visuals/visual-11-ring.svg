<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="visual-11-ring-title visual-11-ring-desc"><title id="visual-11-ring-title">一致性雜湊：新增節點，只搬一段鍵範圍</title><desc id="visual-11-ring-desc">簡化單一 token 環：鍵沿順時針方向，交給遇到的第一個節點。</desc><defs><marker id="visual-11-ring-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">一致性雜湊：新增節點，只搬一段鍵範圍</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">簡化單一 token 環：鍵沿順時針方向，交給遇到的第一個節點。</text><circle cx="280" cy="290" r="152" fill="none" stroke="#b7cdd3" stroke-width="8"/><path d="M280 138 A152 152 0 0 1 411.64 214" fill="none" stroke="#387ac3" stroke-width="10"/><circle cx="280.0" cy="138.0" r="15" fill="#127c79"/><text x="302.0" y="145.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#127c79">A</text><circle cx="411.6358613752347" cy="366.0" r="15" fill="#127c79"/><text x="433.6358613752347" y="373.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#127c79">B</text><circle cx="148.3641386247653" cy="366.0" r="15" fill="#127c79"/><text x="170.3641386247653" y="373.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#127c79">C</text><circle cx="411.6358613752347" cy="214.0" r="15" fill="#387ac3"/><text x="433.6358613752347" y="221.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#387ac3">D 新增</text><text x="332" y="191" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#387ac3">搬給 D</text><text x="280" y="285" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#163b42">順時針找</text><text x="280" y="319" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#163b42">下一個節點</text><rect x="555" y="142" width="367" height="120" rx="12" fill="#eaf2fc" stroke="#387ac3" stroke-width="1.5"/><text x="573" y="174" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#387ac3">新增 D 之後</text><text x="573" y="201" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">(A, D] 這段鍵</text><text x="573" y="225" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">原來屬於 B，現在交給 D</text><rect x="555" y="290" width="367" height="120" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="573" y="322" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">其餘範圍</text><text x="573" y="349" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">在這個簡化模型裡不變</text><text x="573" y="373" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">虛擬節點可改善分布</text><rect x="24" y="478" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="507" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">一致性雜湊降低重映射範圍，但不保證流量平均，也不自動解決搬遷一致性。</text></svg>