<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="visual-13-breaker-title visual-13-breaker-desc"><title id="visual-13-breaker-title">斷路器：只放少量探測，別一次把流量灌回去</title><desc id="visual-13-breaker-desc">Closed 允許呼叫、Open 快速拒絕、Half-open 用有限請求探測。</desc><defs><marker id="visual-13-breaker-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">斷路器：只放少量探測，別一次把流量灌回去</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">Closed 允許呼叫、Open 快速拒絕、Half-open 用有限請求探測。</text><rect x="32" y="150" width="260" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="50" y="182" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">Closed · 正常呼叫</text><text x="50" y="209" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">統計依賴的失敗情況</text><rect x="350" y="150" width="260" height="100" rx="12" fill="#fdebef" stroke="#bd4354" stroke-width="1.5"/><text x="368" y="182" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#bd4354">Open · 快速失敗</text><text x="368" y="209" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">等待設定的冷卻時間</text><rect x="668" y="150" width="260" height="100" rx="12" fill="#fff3d9" stroke="#ad6707" stroke-width="1.5"/><text x="686" y="182" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#ad6707">Half-open · 探測</text><text x="686" y="209" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">只放行有限探測請求</text><path d="M292 190 L347 190" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-13-breaker-arrow)"/><text x="319" y="132" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#163b42">失敗達門檻</text><path d="M610 190 L665 190" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-13-breaker-arrow)"/><text x="638" y="132" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#163b42">冷卻到期</text><path d="M798 250 L798 312 L162 312 L162 253" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-13-breaker-arrow)"/><text x="470" y="301" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#163b42">探測成功 → 恢復</text><path d="M758 150 L758 103 L480 103 L480 146" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-13-breaker-arrow)"/><text x="615" y="92" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#163b42">探測失敗 → 再次開路</text><rect x="24" y="378" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="407" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">斷路器處理持續失敗；單次逾時、限流與資源隔離仍要各自設計。</text></svg>