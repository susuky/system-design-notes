<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="visual-13-bulkhead-title visual-13-bulkhead-desc"><title id="visual-13-bulkhead-title">艙壁隔離：一個租戶卡住，不該耗盡所有名額</title><desc id="visual-13-bulkhead-desc">教學示意：為不同工作類型保留有界的連線／執行配額。</desc><defs><marker id="visual-13-bulkhead-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">艙壁隔離：一個租戶卡住，不該耗盡所有名額</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">教學示意：為不同工作類型保留有界的連線／執行配額。</text><rect x="32" y="138" width="260" height="170" rx="12" fill="#fdebef" stroke="#bd4354" stroke-width="1.5"/><text x="50" y="170" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#bd4354">OCR 重工作</text><text x="50" y="197" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">配額 8</text><text x="50" y="221" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">工作很慢，佇列已滿</text><rect x="350" y="138" width="260" height="170" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="368" y="170" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">互動 API</text><text x="368" y="197" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">配額 4</text><text x="368" y="221" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">仍可回答查詢</text><rect x="668" y="138" width="260" height="170" rx="12" fill="#eaf2fc" stroke="#387ac3" stroke-width="1.5"/><text x="686" y="170" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#387ac3">管理／健康檢查</text><text x="686" y="197" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">配額 2</text><text x="686" y="221" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">保留診斷與修復能力</text><rect x="24" y="368" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="397" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">圖中的配額是教學假設；共用資料庫、CPU 或網路仍可能成為共同瓶頸。</text></svg>