<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="visual-04-ack-title visual-04-ack-desc"><title id="visual-04-ack-title">沒收到 ACK，並不能推論對方沒做事</title><desc id="visual-04-ack-desc">教學時間線：副作用已完成，只有確認訊號在途中遺失。</desc><defs><marker id="visual-04-ack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">沒收到 ACK，並不能推論對方沒做事</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">教學時間線：副作用已完成，只有確認訊號在途中遺失。</text><text x="125" y="123" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#163b42">生產者／呼叫端</text><path d="M125 145 V353" stroke="#c3d4d8" stroke-dasharray="5 5"/><text x="770" y="123" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#163b42">消費者／服務端</text><path d="M770 145 V353" stroke="#c3d4d8" stroke-dasharray="5 5"/><path d="M125 165 L770 165" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-04-ack-arrow)"/><text x="447.5" y="153.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#127c79">要求：扣除一次額度，id = K</text><rect x="580" y="193" width="310" height="83" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="598" y="225" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">副作用已提交</text><text x="598" y="252" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">額度已扣除</text><path d="M770 295 L460 295" fill="none" stroke="#127c79" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#visual-04-ack-arrow)"/><text x="615.0" y="283.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#127c79">ACK 遺失</text><text x="425" y="303" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#bd4354">×</text><path d="M125 342 L770 342" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-04-ack-arrow)"/><text x="447.5" y="330.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#127c79">逾時後，用相同 id = K 重試</text><rect x="24" y="388" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="417" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">唯一鍵／交易或下游冪等契約，才能把重試與「再做一次」分開。</text></svg>