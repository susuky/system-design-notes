<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="visual-12-scale-title visual-12-scale-desc"><title id="visual-12-scale-title">擴容有延遲：機器還沒就緒，積壓已在成長</title><desc id="visual-12-scale-desc">教學假設：流量由 80/s 升至 140/s，原容量 100/s，新容量 160/s。</desc><defs><marker id="visual-12-scale-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">擴容有延遲：機器還沒就緒，積壓已在成長</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">教學假設：流量由 80/s 升至 140/s，原容量 100/s，新容量 160/s。</text><path d="M75 120 V365 H920" fill="none" stroke="#8fa8b0" stroke-width="2"/><text x="36" y="113" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#163b42">件/s</text><text x="62" y="266.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#163b42">80</text><text x="62" y="240.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#163b42">100</text><text x="62" y="188.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#163b42">140</text><text x="62" y="162.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#163b42">160</text><path d="M75 261 H230 V183 H910" fill="none" stroke="#387ac3" stroke-width="4"/><path d="M75 235 H650 V157 H910" fill="none" stroke="#127c79" stroke-width="4"/><text x="270" y="160" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#387ac3">流量 140/s</text><text x="360" y="263" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#ad6707">等待擴容期間 +40 件/s</text><text x="690" y="132" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#127c79">容量 160/s</text><text x="205" y="392" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">突增</text><text x="610" y="392" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">新實例就緒</text><text x="820" y="392" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">時間 →</text><rect x="24" y="408" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="437" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">新容量高於流量後，才有剩餘能力消化積壓；擴容不能倒轉已逾時的請求。</text></svg>