<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="visual-12-scale-title visual-12-scale-desc"><title id="visual-12-scale-title">兩分鐘暖機，四分鐘清空積欠</title><desc id="visual-12-scale-desc">每秒到達100份，舊容量60份。120秒後總容量升到120份。暖機期間累積4800份，之後以每秒20份的淨速度消化，240秒後清空。</desc><rect width="960" height="470" rx="16" fill="#ffffff"/><text x="32" y="43" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" fill="#24262b" text-anchor="start">兩分鐘暖機，四分鐘清空積欠</text><text x="32" y="75" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" fill="#6b707b" text-anchor="start">到達率固定；新機器就緒的時間，決定先欠下多少工作。</text><path d="M90 105 H128" stroke="#256c62" stroke-width="4"/><text x="139" y="111" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" fill="#256c62" text-anchor="start">到達 100 份／秒</text><path d="M400 105 H438" stroke="#496ac3" stroke-width="4"/><text x="449" y="111" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" fill="#496ac3" text-anchor="start">總容量 60 → 120 份／秒</text><path d="M90 370.0 H900" stroke="#dfe3e8" stroke-width="1"/><text x="76" y="376.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="15" font-weight="400" fill="#6b707b" text-anchor="end">0</text><path d="M90 304.3 H900" stroke="#dfe3e8" stroke-width="1"/><text x="76" y="310.3" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="15" font-weight="400" fill="#6b707b" text-anchor="end">40</text><path d="M90 271.4 H900" stroke="#dfe3e8" stroke-width="1"/><text x="76" y="277.4" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="15" font-weight="400" fill="#6b707b" text-anchor="end">60</text><path d="M90 205.7 H900" stroke="#dfe3e8" stroke-width="1"/><text x="76" y="211.7" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="15" font-weight="400" fill="#6b707b" text-anchor="end">100</text><path d="M90 172.9 H900" stroke="#dfe3e8" stroke-width="1"/><text x="76" y="178.9" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="15" font-weight="400" fill="#6b707b" text-anchor="end">120</text><path d="M90 138 V370 H912" fill="none" stroke="#6b707b" stroke-width="1.5"/><text x="38" y="143" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="15" font-weight="400" fill="#6b707b" text-anchor="start">份／秒</text><rect x="90" y="205.7" width="270" height="65.7" fill="#fff0d7"/><rect x="360" y="172.9" width="540" height="32.8" fill="#eaf5f0"/><path d="M360 136 V370" stroke="#8c95a7" stroke-dasharray="6 5" stroke-width="1.5"/><path d="M90 205.7 H900" fill="none" stroke="#256c62" stroke-width="4"/><path d="M90 271.4 H360 V172.9 H900" fill="none" stroke="#496ac3" stroke-width="4"/><text x="225" y="233" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="700" fill="#86570b" text-anchor="middle">累積 4,800 份</text><text x="225" y="257" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="15" font-weight="400" fill="#86570b" text-anchor="middle">40 份／秒 × 120 秒</text><text x="630" y="155" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="700" fill="#256c62" text-anchor="middle">20 份／秒 × 240 秒 = 清掉 4,800 份</text><text x="90" y="396" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" fill="#6b707b" text-anchor="middle">0</text><text x="360" y="396" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" fill="#6b707b" text-anchor="middle">120 秒：新容量就緒</text><text x="900" y="396" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" fill="#6b707b" text-anchor="end">360 秒：追平</text><text x="90" y="442" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#24262b" text-anchor="start">總時間：120 秒暖機 + 240 秒清空 = 360 秒</text></svg>