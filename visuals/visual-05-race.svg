<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="visual-05-race-title visual-05-race-desc"><title id="visual-05-race-title">先查再寫，兩個請求仍可能一起通過</title><desc id="visual-05-race-desc">兩個相同冪等鍵 K 的請求同時抵達；問題出在原子性。</desc><defs><marker id="visual-05-race-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">先查再寫，兩個請求仍可能一起通過</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">兩個相同冪等鍵 K 的請求同時抵達；問題出在原子性。</text><rect x="32" y="120" width="260" height="115" rx="12" fill="#fff3d9" stroke="#ad6707" stroke-width="1.5"/><text x="50" y="152" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#ad6707">請求 A</text><text x="50" y="179" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">查詢 K：不存在</text><text x="50" y="203" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">準備執行副作用</text><rect x="350" y="120" width="260" height="115" rx="12" fill="#fff3d9" stroke="#ad6707" stroke-width="1.5"/><text x="368" y="152" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#ad6707">請求 B</text><text x="368" y="179" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">查詢 K：不存在</text><text x="368" y="203" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">準備執行副作用</text><rect x="670" y="120" width="258" height="115" rx="12" fill="#fdebef" stroke="#bd4354" stroke-width="1.5"/><text x="688" y="152" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#bd4354">錯誤結果</text><text x="688" y="179" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">兩邊都可能執行一次</text><path d="M610 174 L667 174" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-05-race-arrow)"/><path d="M162 235 L162 268 L795 268 L795 238" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-05-race-arrow)"/><rect x="32" y="295" width="896" height="80" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="50" y="327" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">較可靠的邊界：唯一約束＋交易</text><text x="50" y="354" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">以原子操作認領 K；衝突時讀取既有狀態／結果，外部副作用仍需下游冪等。</text><rect x="24" y="378" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="407" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">去重快取可加速查詢；正確性不能只靠「剛才查不到」。</text></svg>