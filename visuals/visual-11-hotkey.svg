<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="visual-11-hotkey-title visual-11-hotkey-desc"><title id="visual-11-hotkey-title">平均分區，還是可能被單一熱鍵打穿</title><desc id="visual-11-hotkey-desc">教學假設：四個分區各能處理 100/s，熱鍵 180/s，其餘 120/s 平均分配。</desc><defs><marker id="visual-11-hotkey-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">平均分區，還是可能被單一熱鍵打穿</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">教學假設：四個分區各能處理 100/s，熱鍵 180/s，其餘 120/s 平均分配。</text><text x="134" y="133" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#163b42">分區 0</text><rect x="74" y="158" width="120" height="200" rx="12" fill="#f0f4f5" stroke="none" stroke-width="1.5"/><rect x="74" y="169.0" width="120" height="189.0" rx="12" fill="#f8b5bf" stroke="none" stroke-width="1.5"/><text x="134" y="390" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#bd4354">210/s</text><text x="369" y="133" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#163b42">分區 1</text><rect x="309" y="158" width="120" height="200" rx="12" fill="#f0f4f5" stroke="none" stroke-width="1.5"/><rect x="309" y="331.0" width="120" height="27.0" rx="12" fill="#b5e3d5" stroke="none" stroke-width="1.5"/><text x="369" y="390" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#127c79">30/s</text><text x="604" y="133" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#163b42">分區 2</text><rect x="544" y="158" width="120" height="200" rx="12" fill="#f0f4f5" stroke="none" stroke-width="1.5"/><rect x="544" y="331.0" width="120" height="27.0" rx="12" fill="#b5e3d5" stroke="none" stroke-width="1.5"/><text x="604" y="390" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#127c79">30/s</text><text x="839" y="133" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#163b42">分區 3</text><rect x="779" y="158" width="120" height="200" rx="12" fill="#f0f4f5" stroke="none" stroke-width="1.5"/><rect x="779" y="331.0" width="120" height="27.0" rx="12" fill="#b5e3d5" stroke="none" stroke-width="1.5"/><text x="839" y="390" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#127c79">30/s</text><path d="M50 268 H920" stroke="#ad6707" stroke-width="2" stroke-dasharray="7 5"/><text x="45" y="251" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#ad6707">各分區容量 100/s</text><rect x="24" y="408" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="437" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">總流量 300/s &lt; 總容量 400/s，分區 0 卻已過載。</text></svg>