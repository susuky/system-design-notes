<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="visual-02-latency-title visual-02-latency-desc"><title id="visual-02-latency-title">平均很快，尾端仍可能讓人等很久</title><desc id="visual-02-latency-desc">教學資料：100 次請求，95 次為 100 ms、4 次為 500 ms、1 次為 3,000 ms。</desc><defs><marker id="visual-02-latency-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">平均很快，尾端仍可能讓人等很久</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">教學資料：100 次請求，95 次為 100 ms、4 次為 500 ms、1 次為 3,000 ms。</text><text x="34" y="140" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#163b42">95 次請求</text><rect x="205" y="115" width="20.0" height="34" rx="5" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="240.0" y="140" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163b42">100 ms</text><text x="34" y="220" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#163b42">4 次請求</text><rect x="205" y="195" width="100.0" height="34" rx="5" fill="#eaf2fc" stroke="#387ac3" stroke-width="1.5"/><text x="320.0" y="220" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163b42">500 ms</text><text x="34" y="300" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#163b42">1 次請求</text><rect x="205" y="275" width="