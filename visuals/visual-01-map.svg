<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="visual-01-map-title visual-01-map-desc"><title id="visual-01-map-title">一份文件，沿著六個責任邊界前進</title><desc id="visual-01-map-desc">先看使用者想完成什麼，再看每個元件負責哪一段。</desc><defs><marker id="visual-01-map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">一份文件，沿著六個責任邊界前進</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">先看使用者想完成什麼，再看每個元件負責哪一段。</text><rect x="32" y="120" width="260" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="50" y="152" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">1 · 上傳 API</text><text x="50" y="179" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">驗證租戶與文件大小</text><rect x="350" y="120" width="260" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="368" y="152" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">2 · 物件儲存</text><text x="368" y="179" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">保存原件；回傳物件參照</text><rect x="668" y="120" width="260" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="686" y="152" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">3 · 工作佇列</text><text x="686" y="179" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">保存待處理工作的意圖</text><rect x="668" y="315" width="260" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="686" y="347" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">4 · OCR 工作者</text><text x="686" y="374" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">取原件、辨識、存結果</text><rect x="350" y="315" width="260" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="368" y="347" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">5 · 狀態資料庫</text><text x="368" y="374" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">讓完成／失敗可查詢</text><rect x="32" y="315" width="260" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="50" y="347" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">6 · 通知與畫面</text><text x="50" y="374" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">提醒使用者查看結果</text><path d="M292 170 L347 170" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-01-map-arrow)"/><path d="M610 170 L665 170" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-01-map-arrow)"/><path d="M798 220 L798 312" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-01-map-arrow)"/><path d="M668 365 L613 365" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-01-map-arrow)"/><path d="M350 365 L295 365" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-01-map-arrow)"/><rect x="24" y="478" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="507" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">工作訊息通常帶「物件參照」，不把整份 5 MB 文件塞進每個訊息。</text></svg>