<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="visual-06-backlog-title visual-06-backlog-desc"><title id="visual-06-backlog-title">佇列像水箱：流入大於流出，就持續累積</title><desc id="visual-06-backlog-desc">教學假設：抵達 120 件／秒，完成 100 件／秒，初始沒有積壓。</desc><defs><marker id="visual-06-backlog-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">佇列像水箱：流入大於流出，就持續累積</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">教學假設：抵達 120 件／秒，完成 100 件／秒，初始沒有積壓。</text><rect x="32" y="145" width="225" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="50" y="177" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">流入 λ = 120/s</text><text x="50" y="204" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">新文件工作</text><rect x="700" y="145" width="225" height="100" rx="12" fill="#eaf2fc" stroke="#387ac3" stroke-width="1.5"/><text x="718" y="177" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#387ac3">流出 μ = 100/s</text><text x="718" y="204" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">固定處理能力</text><rect x="370" y="125" width="220" height="225" rx="12" fill="#f5fbfb" stroke="#127c79" stroke-width="1.5"/><rect x="372" y="233" width="216" height="115" rx="12" fill="#b5e1d7" stroke="none" stroke-width="1.5"/><text x="480" y="194" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#163b42">等待中的工作</text><text x="480" y="277" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#127c79">+20 件／秒</text><path d="M257 195 L367 195" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-06-backlog-arrow)"/><path d="M590 195 L697 195" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-06-backlog-arrow)"/><text x="360" y="384" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#163b42">60 秒後：多出 1,200 件積壓</text><rect x="24" y="408" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="437" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">擴大佇列容量延後溢出，卻不會把長期處理能力變成 120/s。</text></svg>