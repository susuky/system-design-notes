<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="visual-04-fanout-title visual-04-fanout-desc"><title id="visual-04-fanout-title">工作分攤與事件廣播：箭頭看似相同，責任不同</title><desc id="visual-04-fanout-desc">同一訊息要由一位工作者承擔，還是要讓多個業務各自知道？</desc><defs><marker id="visual-04-fanout-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">工作分攤與事件廣播：箭頭看似相同，責任不同</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">同一訊息要由一位工作者承擔，還是要讓多個業務各自知道？</text><rect x="32" y="120" width="240" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="50" y="152" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">工作佇列</text><text x="50" y="179" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">工作 A、B、C</text><rect x="570" y="110" width="350" height="95" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="588" y="142" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">OCR 工作者 1</text><text x="588" y="169" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">例如領取 A、C</text><rect x="570" y="235" width="350" height="95" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="588" y="267" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">OCR 工作者 2</text><text x="588" y="294" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">例如領取 B</text><path d="M272 158 L565 158" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-04-fanout-arrow)"/><text x="418.5" y="146.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#127c79">競爭領取</text><path d="M272 185 L420 185 L420 280 L568 280" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-04-fanout-arrow)"/><rect x="32" y="360" width="240" height="95" rx="12" fill="#eaf2fc" stroke="#387ac3" stroke-width="1.5"/><text x="50" y="392" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#387ac3">完成事件</text><text x="50" y="419" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">DocumentProcessed</text><rect x="355" y="360" width="250" height="95" rx="12" fill="#eaf2fc" stroke="#387ac3" stroke-width="1.5"/><text x="373" y="392" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#387ac3">通知訂閱</text><text x="373" y="419" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">寄送完成提醒</text><rect x="670" y="360" width="250" height="95" rx="12" fill="#eaf2fc" stroke="#387ac3" stroke-width="1.5"/><text x="688" y="392" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#387ac3">分析訂閱</text><text x="688" y="419" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">更新使用統計</text><path d="M272 396 L352 396" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-04-fanout-arrow)"/><path d="M152 360 L152 342 L795 342 L795 358" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-04-fanout-arrow)"/><rect x="24" y="458" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="487" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">競爭消費者仍可能因重送重複處理；廣播則是每個訂閱各自消費。</text></svg>