<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="visual-02-replica-title visual-02-replica-desc"><title id="visual-02-replica-title">寫成功後，為什麼立刻讀到舊資料？</title><desc id="visual-02-replica-desc">非同步複寫情境：主節點已提交，但副本尚未追上。</desc><defs><marker id="visual-02-replica-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">寫成功後，為什麼立刻讀到舊資料？</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">非同步複寫情境：主節點已提交，但副本尚未追上。</text><text x="120" y="120" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#163b42">客戶端</text><path d="M120 140 V345" stroke="#b6cbd0" stroke-width="2" stroke-dasharray="5 5"/><text x="470" y="120" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#163b42">主節點</text><path d="M470 140 V345" stroke="#b6cbd0" stroke-width="2" stroke-dasharray="5 5"/><text x="820" y="120" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#163b42">讀取副本</text><path d="M820 140 V345" stroke="#b6cbd0" stroke-width="2" stroke-dasharray="5 5"/><path d="M120 160 L470 160" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-02-replica-arrow)"/><text x="295.0" y="148.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#127c79">寫入版本 v2</text><path d="M470 213 L120 213" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-02-replica-arrow)"/><text x="295.0" y="201.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#127c79">已提交，回應成功</text><path d="M120 264 L820 264" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-02-replica-arrow)"/><text x="470.0" y="252.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#127c79">讀取 → 副本目前仍是 v1</text><path d="M470 327 L820 327" fill="none" stroke="#127c79" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#visual-02-replica-arrow)"/><text x="645.0" y="315.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#127c79">複寫 v2 終於抵達</text><rect x="24" y="388" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="417" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">「寫入已確認」的邊界，不一定包含「所有讀取副本都已更新」。</text></svg>