<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="visual-03-domains-title visual-03-domains-desc"><title id="visual-03-domains-title">兩份副本，放在哪裡才有意義？</title><desc id="visual-03-domains-desc">故障域是可能一起失效的範圍；增加副本數之前，先看共享了什麼。</desc><defs><marker id="visual-03-domains-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">兩份副本，放在哪裡才有意義？</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">故障域是可能一起失效的範圍；增加副本數之前，先看共享了什麼。</text><rect x="25" y="110" width="910" height="304" rx="12" fill="#f4f8fa" stroke="#b7c8ce" stroke-width="1.5"/><text x="44" y="144" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163b42">同一 Region（區域）</text><rect x="48" y="162" width="402" height="225" rx="12" fill="#fff" stroke="#8aaeb7" stroke-width="1.5"/><text x="66" y="194" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163b42">可用區 A</text><rect x="510" y="162" width="402" height="225" rx="12" fill="#fff" stroke="#8aaeb7" stroke-width="1.5"/><text x="528" y="194" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163b42">可用區 B</text><rect x="68" y="220" width="170" height="105" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="86" y="252" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">副本 1</text><text x="86" y="279" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">同一機櫃</text><rect x="252" y="220" width="170" height="105" rx="12" fill="#fff3d9" stroke="#ad6707" stroke-width="1.5"/><text x="270" y="252" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#ad6707">副本 2</text><text x="270" y="279" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">同一機櫃</text><rect x="540" y="220" width="332" height="105" rx="12" fill="#eaf2fc" stroke="#387ac3" stroke-width="1.5"/><text x="558" y="252" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#387ac3">副本 3</text><text x="558" y="279" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">分散可用區故障風險</text><text x="70" y="359" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#bd4354">機櫃供電故障可能一起失去 1、2</text><text x="540" y="359" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">仍須考慮跨區域共同依賴</text><rect x="24" y="448" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="477" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">跨可用區 ≠ 能承受所有區域級事故；副本也不是歷史備份。</text></svg>