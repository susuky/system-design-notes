<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="visual-14-loop-title visual-14-loop-desc"><title id="visual-14-loop-title">設計不是畫完圖，而是能被驗證的循環</title><desc id="visual-14-loop-desc">每項架構選擇都要能回答：因為什麼需求、付出什麼成本、怎麼知道失效？</desc><defs><marker id="visual-14-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">設計不是畫完圖，而是能被驗證的循環</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">每項架構選擇都要能回答：因為什麼需求、付出什麼成本、怎麼知道失效？</text><rect x="32" y="130" width="260" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="50" y="162" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">1 · 需求</text><text x="50" y="189" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">例如 p99 &lt; 300 ms</text><rect x="350" y="130" width="260" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="368" y="162" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">2 · 假設與設計</text><text x="368" y="189" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">容量／一致性／故障邊界</text><rect x="668" y="130" width="260" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="686" y="162" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">3 · 驗證</text><text x="686" y="189" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">壓測＋故障演練＋觀測</text><path d="M292 177 L347 177" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-14-loop-arrow)"/><path d="M610 177 L665 177" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-14-loop-arrow)"/><path d="M800 231 L800 319 L162 319 L162 233" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-14-loop-arrow)"/><text x="480" y="306" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#163b42">量測不符 → 修正假設、取捨或需求</text><rect x="24" y="368" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="397" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">每個數字標示是假設還是實測；沒有量測證據時，不把圖當成性能保證。</text></svg>