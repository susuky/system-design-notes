<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="visual-06-pool-title visual-06-pool-desc"><title id="visual-06-pool-title">執行緒池：限制進行中工作，也要限制等待區</title><desc id="visual-06-pool-desc">CPU 工作之外，還可能受記憶體、資料庫連線與下游配額限制。</desc><defs><marker id="visual-06-pool-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">執行緒池：限制進行中工作，也要限制等待區</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">CPU 工作之外，還可能受記憶體、資料庫連線與下游配額限制。</text><rect x="32" y="130" width="230" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="50" y="162" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">入口</text><text x="50" y="189" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">容量檢查／拒絕策略</text><rect x="350" y="130" width="250" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="368" y="162" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">有界等待佇列</text><text x="368" y="189" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">例如最多 200 件</text><path d="M262 175 L347 175" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-06-pool-arrow)"/><rect x="695" y="110" width="230" height="84" rx="12" fill="#eaf2fc" stroke="#387ac3" stroke-width="1.5"/><text x="713" y="142" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#387ac3">工作者 1</text><text x="713" y="169" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">處理一件工作</text><rect x="695" y="220" width="230" height="84" rx="12" fill="#eaf2fc" stroke="#387ac3" stroke-width="1.5"/><text x="713" y="252" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#387ac3">工作者 2</text><text x="713" y="279" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">處理一件工作</text><rect x="695" y="330" width="230" height="84" rx="12" fill="#eaf2fc" stroke="#387ac3" stroke-width="1.5"/><text x="713" y="362" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#387ac3">工作者 N</text><text x="713" y="389" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">處理一件工作</text><path d="M600 180 L643 180 L643 152 L692 152" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-06-pool-arrow)"/><path d="M600 180 L643 180 L643 262 L692 262" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-06-pool-arrow)"/><path d="M600 180 L643 180 L643 372 L692 372" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-06-pool-arrow)"/><rect x="32" y="295" width="566" height="96" rx="12" fill="#fff3d9" stroke="#ad6707" stroke-width="1.5"/><text x="50" y="327" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#ad6707">佇列滿時，必須有明確契約</text><text x="50" y="354" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">阻塞／拒絕／丟棄／降級，各有不同使用者結果。</text><rect x="24" y="438" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="467" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">工作者數量有界，並不代表整個服務的記憶體使用量有界。</text></svg>