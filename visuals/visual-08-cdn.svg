<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="visual-08-cdn-title visual-08-cdn-desc"><title id="visual-08-cdn-title">CDN：重複內容在近端交付，未命中才回源</title><desc id="visual-08-cdn-desc">以可公開快取的版本化圖片為例；私人文件需另設授權與快取隔離。</desc><defs><marker id="visual-08-cdn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">CDN：重複內容在近端交付，未命中才回源</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">以可公開快取的版本化圖片為例；私人文件需另設授權與快取隔離。</text><rect x="32" y="120" width="230" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="50" y="152" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">使用者</text><text x="50" y="179" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">請求 preview-v7.webp</text><rect x="350" y="120" width="260" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="368" y="152" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">附近的邊緣節點</text><text x="368" y="179" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">檢查快取鍵與新鮮度</text><rect x="690" y="265" width="235" height="100" rx="12" fill="#eaf2fc" stroke="#387ac3" stroke-width="1.5"/><text x="708" y="297" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#387ac3">來源服務</text><text x="708" y="324" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">產生／讀取原始資源</text><path d="M262 167 L347 167" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-08-cdn-arrow)"/><path d="M480 220 L480 315 L687 315" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-08-cdn-arrow)"/><text x="586" y="300" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#163b42">未命中才回源</text><path d="M350 200 L300 200 L300 285 L145 285 L145 222" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-08-cdn-arrow)"/><text x="169" y="317" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#163b42">命中直接回傳</text><rect x="24" y="378" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="407" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">邊緣快取加快分發；失效傳播、私有資料與回源保護仍要設計。</text></svg>