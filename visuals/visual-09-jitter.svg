<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="visual-09-jitter-title visual-09-jitter-desc"><title id="visual-09-jitter-title">同時重試會形成第二波尖峰</title><desc id="visual-09-jitter-desc">教學示意：加入隨機抖動後，重試時點分散，但總量仍要有上限。</desc><defs><marker id="visual-09-jitter-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">同時重試會形成第二波尖峰</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">教學示意：加入隨機抖動後，重試時點分散，但總量仍要有上限。</text><text x="35" y="140" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#bd4354">固定 1 秒重試</text><path d="M270 170 H920" stroke="#c9d7db" stroke-width="2"/><circle cx="740" cy="146.0" r="7" fill="#bd4354"/><circle cx="740" cy="162.0" r="7" fill="#bd4354"/><circle cx="740" cy="178.0" r="7" fill="#bd4354"/><circle cx="740" cy="194.0" r="7" fill="#bd4354"/><text x="270" y="215" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#163b42">失敗後 0 秒</text><text x="875" y="215" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#163b42">時間 →</text><text x="35" y="260" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#127c79">隨機等待</text><path d="M270 290 H920" stroke="#c9d7db" stroke-width="2"/><circle cx="387.5" cy="290" r="7" fill="#127c79"/><circle cx="528.5" cy="290" r="7" fill="#127c79"/><circle cx="636.6" cy="290" r="7" fill="#127c79"/><circle cx="834.0" cy="290" r="7" fill="#127c79"/><text x="270" y="335" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#163b42">失敗後 0 秒</text><text x="875" y="335" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#163b42">時間 →</text><rect x="24" y="378" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="407" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">Jitter 降低同步尖峰；仍需重試上限、截止時間與冪等性。</text></svg>