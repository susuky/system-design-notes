<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="visual-12-token-title visual-12-token-desc"><title id="visual-12-token-title">Token bucket：速率與突發上限是兩個旋鈕</title><desc id="visual-12-token-desc">教學假設：每秒補充 5 枚 token，桶最多保存 10 枚，每個請求消耗 1 枚。</desc><defs><marker id="visual-12-token-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">Token bucket：速率與突發上限是兩個旋鈕</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">教學假設：每秒補充 5 枚 token，桶最多保存 10 枚，每個請求消耗 1 枚。</text><rect x="32" y="130" width="230" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="50" y="162" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">補充速率 5/s</text><text x="50" y="189" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">桶滿就不再累積</text><rect x="690" y="130" width="235" height="100" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="708" y="162" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">請求進來</text><text x="708" y="189" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">拿到 1 枚才放行</text><path d="M262 177 L347 177" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-12-token-arrow)"/><path d="M610 177 L687 177" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-12-token-arrow)"/><rect x="350" y="113" width="260" height="175" rx="12" fill="#f0f8f5" stroke="#127c79" stroke-width="1.5"/><circle cx="385" cy="151" r="16" fill="#67bfa7"/><circle cx="432" cy="151" r="16" fill="#67bfa7"/><circle cx="479" cy="151" r="16" fill="#67bfa7"/><circle cx="526" cy="151" r="16" fill="#67bfa7"/><circle cx="573" cy="151" r="16" fill="#67bfa7"/><circle cx="385" cy="207" r="16" fill="#67bfa7"/><circle cx="432" cy="207" r="16" fill="#67bfa7"/><circle cx="479" cy="207" r="16" fill="#67bfa7"/><circle cx="526" cy="207" r="16" fill="#67bfa7"/><circle cx="573" cy="207" r="16" fill="#67bfa7"/><text x="480" y="268" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#127c79">桶容量 10</text><rect x="32" y="325" width="893" height="74" rx="12" fill="#fff3d9" stroke="#ad6707" stroke-width="1.5"/><text x="50" y="357" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#ad6707">瞬間可以用掉已累積的 10 枚</text><text x="50" y="384" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">但長期流量仍受補充速率控制；沒有 token 時可拒絕，或在有界佇列短暫等待。</text><rect x="24" y="428" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="457" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">token 是配額，並非已排入佇列的請求；容量越大，容許突發越大。</text></svg>