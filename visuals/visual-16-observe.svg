<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="visual-16-observe-title visual-16-observe-desc"><title id="visual-16-observe-title">同一個故障，用三種觀測資料追查</title><desc id="visual-16-observe-desc">先用指標發現異常，再用追蹤縮小位置，最後用日誌補上事件細節。</desc><defs><marker id="visual-16-observe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">同一個故障，用三種觀測資料追查</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">先用指標發現異常，再用追蹤縮小位置，最後用日誌補上事件細節。</text><rect x="32" y="135" width="260" height="150" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="50" y="167" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">Metrics · 指標</text><text x="50" y="194" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">p99 延遲上升</text><text x="50" y="218" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">哪個服務／區域異常？</text><rect x="350" y="135" width="260" height="150" rx="12" fill="#eaf2fc" stroke="#387ac3" stroke-width="1.5"/><text x="368" y="167" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#387ac3">Traces · 追蹤</text><text x="368" y="194" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">一條請求的跨服務耗時</text><text x="368" y="218" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">時間花在哪個 span？</text><rect x="668" y="135" width="260" height="150" rx="12" fill="#fff3d9" stroke="#ad6707" stroke-width="1.5"/><text x="686" y="167" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#ad6707">Logs · 日誌</text><text x="686" y="194" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">單一事件的具體細節</text><text x="686" y="218" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">該次錯誤發生了什麼？</text><path d="M292 211 L347 211" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-16-observe-arrow)"/><path d="M610 211 L665 211" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-16-observe-arrow)"/><rect x="24" y="368" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="397" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">追蹤按取樣與保留策略保存；標籤基數決定儲存與查詢成本。</text></svg>
