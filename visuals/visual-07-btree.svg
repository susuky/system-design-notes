<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="visual-07-btree-title visual-07-btree-desc"><title id="visual-07-btree-title">B-tree：用一頁的分支資訊，跳過大量資料</title><desc id="visual-07-btree-desc">簡化 B+ tree 示意，根頁的分隔鍵決定下一次讀哪個子頁。</desc><defs><marker id="visual-07-btree-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127c79"/></marker></defs><rect width="960" height="100%" rx="16" fill="#fff"/><text x="32" y="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#163b42">B-tree：用一頁的分支資訊，跳過大量資料</text><text x="32" y="76" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#587078">簡化 B+ tree 示意，根頁的分隔鍵決定下一次讀哪個子頁。</text><rect x="345" y="110" width="270" height="85" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="363" y="142" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">分隔鍵 30 ｜ 60</text><text x="363" y="169" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">搜尋 key = 42</text><rect x="32" y="282" width="260" height="90" rx="12" fill="#f0f3f5" stroke="#627882" stroke-width="1.5"/><text x="50" y="314" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#627882">鍵值小於 30</text><text x="50" y="341" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">10、18、25</text><rect x="350" y="282" width="260" height="90" rx="12" fill="#e5f5f1" stroke="#127c79" stroke-width="1.5"/><text x="368" y="314" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#127c79">30 ≤ 鍵值 &lt; 60</text><text x="368" y="341" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">35、42、58</text><rect x="668" y="282" width="260" height="90" rx="12" fill="#f0f3f5" stroke="#627882" stroke-width="1.5"/><text x="686" y="314" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#627882">鍵值至少 60</text><text x="686" y="341" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#163b42">62、75、90</text><path d="M405 195 L162 280" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-07-btree-arrow)"/><path d="M480 195 L480 280" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-07-btree-arrow)"/><text x="480.0" y="225.5" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#127c79">走這條</text><path d="M555 195 L798 280" fill="none" stroke="#127c79" stroke-width="2.5" marker-end="url(#visual-07-btree-arrow)"/><rect x="24" y="398" width="912" height="44" rx="12" fill="#f0f5f6" stroke="none" stroke-width="1.5"/><text x="42" y="427" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#127c79">高扇出降低樹高；實際頁面大小、快取命中與資料布局共同影響 I/O。</text></svg>